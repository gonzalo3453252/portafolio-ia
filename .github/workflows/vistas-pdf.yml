name: Generar vistas PDF de presentaciones e informes

# Cada vez que subes un .pptx/.ppt/.docx/.doc a archivos/semana-XX/, se crea su vista PDF
# (en archivos/semana-XX/_vista/) para que la página la muestre nítida y completa.
on:
  push:
    branches: [main]
    paths:
      - 'archivos/**/*.pptx'
      - 'archivos/**/*.ppt'
      - 'archivos/**/*.docx'
      - 'archivos/**/*.doc'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vistas-pdf
  cancel-in-progress: false

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar LibreOffice
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core

      # Los PDF se generan en una carpeta temporal FUERA del repositorio (no se tocan archivos
      # del repo aquí). Así, si otra ejecución guardó cambios mientras tanto, no hay conflictos.
      - name: Convertir archivos nuevos o modificados
        run: |
          shopt -s nullglob
          BASE=archivos
          STAGE="$RUNNER_TEMP/vistas"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          CHANGED=$(git -c core.quotepath=false diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          for f in $BASE/semana-*/*.pptx $BASE/semana-*/*.ppt $BASE/semana-*/*.docx $BASE/semana-*/*.doc; do
            d=$(dirname "$f"); n=$(basename "$f"); out="$d/_vista/$n.pdf"
            if [ ! -f "$out" ] || echo "$CHANGED" | grep -qxF "$f"; then
              echo "Convirtiendo: $f"
              tmp=$(mktemp -d)
              if timeout 300 soffice --headless --convert-to pdf --outdir "$tmp" "$f" >/dev/null 2>&1 && [ -f "$tmp/${n%.*}.pdf" ]; then
                mkdir -p "$STAGE/$d/_vista"
                mv "$tmp/${n%.*}.pdf" "$STAGE/$out"
              else
                echo "::warning::No se pudo convertir: $f"
              fi
              rm -rf "$tmp"
            fi
          done

      # Se parte siempre de la última versión de main y se copian encima los PDF nuevos.
      # Si el push falla (otra ejecución guardó antes), se repite desde cero: nunca hay merge de binarios.
      # Si después de varios intentos no se pudo guardar, el paso FALLA (antes salía "success" aunque no guardara).
      - name: Guardar vistas en el repositorio
        run: |
          shopt -s nullglob
          STAGE="$RUNNER_TEMP/vistas"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ -d "$STAGE/archivos" ]; then cp -a "$STAGE/archivos/." archivos/; fi
            # limpiar vistas cuyo archivo original ya no existe
            for v in archivos/semana-*/_vista/*.pdf; do
              d=$(dirname "$(dirname "$v")"); src="$d/$(basename "$v" .pdf)"
              [ -f "$src" ] || { echo "Borrando vista huérfana: $v"; rm -f "$v"; }
            done
            # la lista de archivos (datos/archivos.js) se rehace aquí, ya con los PDF nuevos incluidos
            python3 .github/scripts/generar_archivos_lista.py
            git add -A archivos datos/archivos.js
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -m "Vistas PDF generadas automáticamente"
            if git push origin HEAD:main; then echo "Vistas guardadas"; exit 0; fi
            echo "Intento $i falló; se reintenta desde la última versión de main"
            sleep $((i * 5))
          done
          echo "::error::No se pudieron guardar las vistas PDF después de 5 intentos"
          exit 1
